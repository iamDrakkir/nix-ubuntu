formatter = "nixfmt"

# Place inherit statements sorted among ordinary bindings (default: "front")
inherit-placement = "sorted"

[args]
first = ["self", "lib", "config", "pkgs"]
last = ["<defaulted>", "..."]

[attrs]
# Collapse repeated attrpaths: a.b = 1; a.c = 2; -> a = { b = 1; c = 2; }
merge = true
# Restore blank lines between multiline bindings after reordering
blank-lines = 1
blank-lines-mode = "multiline"

# Sort names inside inherit statements
[inherits]
sort = true

[lets]
sort = true

# NOTE: global list sorting is intentionally left off; list order is often
# significant. It can be enabled per-attrpath via [[overrides]], e.g.:
#   [[overrides]]
#   path = "**.environment.systemPackages"
#   lists.sort = true
#
# ...but do NOT enable it for `**.imports` or `**.home.packages` here.
# pedantix treats comments as positional rather than attached to the item
# below them, so sorting a list that uses section-header comments detaches
# them: `# System` ends up over gaming.nix, and development.nix's
# "# node2nix # TODO: broken" lands over github-copilot-cli. Lists whose
# comments are *trailing* (same line) survive sorting fine.
#
# Import/package lists in this repo are grouped by leading comments and are
# kept alphabetical within each group by hand.
