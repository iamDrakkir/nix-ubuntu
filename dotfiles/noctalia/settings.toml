[plugins]
enabled = [ "lucasoe/proton-pass" ]

[shell.launcher]
categories = false
compact = true
fetch_exchange_rates = false

    [shell.launcher.providers.session]
    global = true

[shell.panel]
launcher_placement = "attached"

[shell.screen_corners]
enabled = true

[shell.screenshot]
pipe_command = "satty -f -"
pipe_to_command = true

[theme]
builtin = "Ayu"
community_palette = "Ayu Blue"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "ghostty", "niri", "starship" ]
    community_ids = [ "opencode", "zen-browser", "neovim", "vscode", "bat", "herdr", "lazygit" ]

