config_version = 13

[bar.default]
capsule = true
center = [ "taskbar" ]
end = [ "privacy", "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = [ "clock", "date", "control-center", "launcher" ]
thickness = 30

[desktop_widgets]
enabled = false

[location]
address = "Norrköping"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-6",
    "lockscreen-login-box@DP-5",
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-4",
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@eDP-1"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
